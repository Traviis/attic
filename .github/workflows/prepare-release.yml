name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: CalVer version (YYYY.M.PATCH); optional
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            keep-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        # v7
        uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{
            strategy.job-index || 0 }}-${{ hashFiles('flake.lock') }}-${{
            github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ strategy.job-index || 0 }}-
          gc-max-store-size: 5G

      - name: Verify release tooling
        run: nix develop -c python3 .ci/test-prepare-release.py
      - name: Prepare version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [[ -n "$REQUESTED_VERSION" ]]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          version=$(python3 .ci/prepare-release.py "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          title="release: prepare v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin \
            "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add Cargo.lock attic/Cargo.toml client/Cargo.toml \
            server/Cargo.toml token/Cargo.toml crane.nix
          git commit -m "$title"
          git push --force-with-lease origin "$branch"
          body="Prepares Attic v$VERSION. Merge after review,"
          body+=" then run Publish release for this version."
          pr_number=$(gh pr list --state open --base main --head "$branch" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" \
              --body "$body"
          fi
          gh workflow run build.yml --ref "$branch"
